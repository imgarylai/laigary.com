name: CI

# check (lint / format / test / build) runs on every PR, on push to main, and on
# manual dispatch (any branch) and gates the deploy. deploy (alchemy → Cloudflare
# Workers) only runs after check passes AND only from main — push or manual
# dispatch of main. Dispatching the workflow on a feature branch runs the checks
# alone; it must never ship an unreviewed branch to production. dry-run is the
# same Alchemy pass in read-only mode on PRs, so a deploy that would die on main
# dies on the PR instead.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit + Workers KV Storage:Edit (for the
#                            Alchemy state worker) + Account Settings:Read + the
#                            Access/Zone/D1/R2 scopes Alchemy provisions. Zone
#                            Settings:Edit specifically: alchemy.run.ts asserts the
#                            zone's browser cache TTL, so a token without it fails
#                            the deploy rather than skipping that resource.
#   CLOUDFLARE_ACCOUNT_ID  — target account id.
#   ALCHEMY_STATE_TOKEN    — the account-wide Alchemy state-store token (same value
#                            across every Alchemy project so they share the one
#                            `alchemy-state-service` worker).
#   R2_ACCESS_KEY_ID       — R2 S3 API access key id (for presigned uploads, #28).
#   R2_SECRET_ACCESS_KEY   — R2 S3 API secret access key.
#   CODECOV_TOKEN          — Codecov upload token (coverage from the Test leg).
#   MCP_ADMIN_TOKEN        — bearer token for the MCP write tools (/mcp). Optional:
#                            without it the MCP server runs read-only.
#   GOOGLE_CLIENT_ID       — Google OAuth client id for the Access "Sign in with
#   GOOGLE_CLIENT_SECRET     Google" IdP. Optional: without both, the IdP block in
#                            alchemy.run.ts is skipped and Access keeps accepting
#                            every account IdP.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
          - name: Typecheck
            command: pnpm typecheck
          - name: Format
            command: pnpm format:check
          - name: Test
            command: pnpm test:coverage
          - name: Build
            command: pnpm build
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - name: Upload coverage to Codecov
        if: matrix.name == 'Test'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  dry-run:
    name: Deploy (dry run)
    runs-on: ubuntu-latest
    needs: [check]
    # `alchemy run` is Alchemy's read-only phase: it evaluates alchemy.run.ts,
    # provisions/reads the shared state store and reads each resource's state,
    # but creates, updates and deletes nothing. That covers the half of a deploy
    # the other legs cannot see — a broken entrypoint, missing or unscoped
    # Cloudflare credentials, an unreachable state store. The undici break that
    # motivated this job failed exactly there, in the first API call, and because
    # deploy only runs on main it sat red for a day before anyone noticed.
    #
    # Fork PRs get no secrets, so this is skipped there rather than failing on
    # empty credentials. Note that a PR ADDING an Alchemy resource fails here with
    # "Resource ... not found and running in 'read' phase" — prod state has
    # nothing for it yet. That is expected; the deploy leg creates it on merge.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: alchemy run (read-only)
        run: pnpm exec alchemy run --stage prod
        env:
          # Same environment as the deploy below: which bindings the entrypoint
          # constructs depends on these being present, so a dry run without them
          # would read a different app than the one that ships.
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [check]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: alchemy deploy
        run: pnpm exec alchemy deploy --stage prod
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          # R2 S3 presign credentials, baked into the worker via alchemy.secret (#28).
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
          # Google OAuth IdP credentials, baked into the Access IdP via
          # alchemy.secret. Without them the IdP block is skipped.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
